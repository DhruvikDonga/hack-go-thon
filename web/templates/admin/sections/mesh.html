{{ define "section-mesh" }}
<div id="section-mesh" class="lg:col-span-7 flex flex-col space-y-6 section-card transition-all">
        <div class="bg-cardBg border border-borderCol rounded-xl p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
              <h2 class="text-base font-semibold text-white flex items-center ">
                <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <span>Active Mesh Rooms & Clients</span>
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">Live view from <code class="text-emerald-400">MeshServer.GetClientsInRoom()</code></p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button data-target="mesh" onclick="focusSection('mesh')" class="section-expand-btn px-2.5 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center space-x-1 shrink-0 whitespace-nowrap" title="Focus this section exclusively">
                <svg class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                <span class="focus-btn-label">Focus</span>
              </button>
              <button onclick="requestStateRefresh()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center space-x-1.5 shrink-0 whitespace-nowrap">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span>Refresh</span>
              </button>
            </div>
          </div>

          <!-- Join / Create Room Toolbar -->
          <div class="flex items-center gap-2 mb-4 bg-slate-950/80 p-2.5 rounded-lg border border-borderCol">
            <input id="newRoomInput" type="text" placeholder="Enter room name (e.g. chat, room-1, custom-room)..." class="flex-1 min-w-0 bg-slate-900 border border-borderCol rounded-md px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500 font-mono" onkeydown="if(event.key==='Enter') joinCustomRoom();" />
            <button onclick="joinCustomRoom()" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium rounded-md shadow transition flex items-center space-x-1 whitespace-nowrap shrink-0 whitespace-nowrap">
              <span>➕ Join / Create Room</span>
            </button>
          </div>

          <!-- Rooms Container -->
          <div id="roomsContainer" class="space-y-3">
            <div class="text-sm text-slate-400 py-6 text-center italic">Waiting for mesh telemetry...</div>
          </div>
        </div>

        <!-- Global Announcement / Mesh Broadcast Tool -->
        <div class="bg-cardBg border border-borderCol rounded-xl p-6 shadow-sm">
          <h2 class="text-base font-semibold text-white mb-2 flex items-center ">
            <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
            </svg>
            <span>Mesh Broadcast Tool</span>
          </h2>
          <p class="text-xs text-slate-400 mb-4">Broadcast a message to mesh-global (all clients) or any active room.</p>
          <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3">
            <select id="broadcastTarget" class="bg-slate-900 border border-borderCol rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-brand-500">
              <option value="mesh-global" selected>mesh-global (All Clients)</option>
            </select>
            <input id="broadcastInput" type="text" placeholder="Type broadcast message..." class="flex-1 min-w-0 bg-slate-900 border border-borderCol rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500" onkeydown="if(event.key==='Enter') sendAdminBroadcast();" />
            <button onclick="sendAdminBroadcast()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-medium text-sm rounded-lg shadow-sm transition shrink-0 whitespace-nowrap">
              Broadcast
            </button>
          </div>
        </div>

        <!-- Live Event Stream Feed -->
        <div class="bg-cardBg border border-borderCol rounded-xl p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <h2 class="text-base font-semibold text-white flex items-center ">
              <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
              </svg>
              <span>Live Mesh Activity Feed</span>
            </h2>
            <button onclick="clearEventLogs()" class="text-xs text-slate-400 hover:text-slate-200">Clear Logs</button>
          </div>
          <div id="eventLogs" class="h-44 overflow-y-auto font-mono text-xs p-3 rounded-lg bg-slate-950 border border-borderCol space-y-1.5 text-slate-300">
            <div class="text-slate-500 italic">Initialized event logger...</div>
          </div>
        </div>
      </div>
{{ end }}
